name: Feature Request / Đề Xuất Tính Năng
description: Suggest a new astronomical dataset, shader upgrade, or observatory feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Đề xuất tính năng mới cho **Milky Way 1:1 Observatory** (MIT License — DanGuangLT & LienThuan04).

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary / Tóm tắt tính năng
      placeholder: Mô tả ngắn gọn tính năng bạn muốn thêm...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Scientific or UX Motivation / Lý do khoa học hoặc trải nghiệm người dùng
      placeholder: Tại sao tính năng này hữu ích hoặc sát với dữ liệu NASA / ESA Gaia DR3?
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: NASA / ESA / Paper References / Tài liệu tham khảo (nếu có)
      placeholder: Liên kết đến bài báo thiên văn học hoặc dữ liệu công khai...
    validations:
      required: false
