name: Feature Request
description: Suggest a new astronomical dataset, shader upgrade, or observatory feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new feature for **Milky Way 1:1 Observatory** (MIT License — DanGuangLT & LienThuan04).

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      placeholder: Briefly describe the feature you would like to add...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Scientific or UX Motivation
      placeholder: Why is this feature useful or how does it improve NASA / ESA Gaia DR3 accuracy?
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: NASA / ESA / Paper References (optional)
      placeholder: Links to astrophysics papers or public datasets...
    validations:
      required: false
