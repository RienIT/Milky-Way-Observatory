name: Bug Report / Báo Lỗi
description: Report a rendering, physics, UI, or build issue in Milky Way 1:1 Observatory
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi cho dự án của **DanGuangLT** & **LienThuan04**. Vui lòng cung cấp thông tin chi tiết bên dưới.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug / Mô tả lỗi
      description: Clear description of what went wrong.
      placeholder: Ví dụ: Khi xoay góc nhìn quanh Sagittarius A*...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / Các bước tái hiện
      placeholder: |
        1. Mở chế độ True 1:1
        2. Chọn thiên thể...
        3. Xoay camera...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & GPU / Trình duyệt & Cấu hình máy
      placeholder: Chrome 131, Windows 11, RTX 3060 / Intel Iris Xe
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console Errors or Screenshots / Lỗi Console hoặc Ảnh chụp màn hình
      render: shell
    validations:
      required: false
