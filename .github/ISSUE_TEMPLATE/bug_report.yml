name: Bug Report
description: Report a rendering, physics, UI, or build issue in Milky Way 1:1 Observatory
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to **DanGuangLT** & **LienThuan04**. Please provide detailed reproduction steps below.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Clear and concise description of what went wrong.
      placeholder: Example: While orbiting around Sagittarius A*...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Switch to True 1:1 mode
        2. Select celestial body...
        3. Rotate camera...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & Hardware Environment
      placeholder: Chrome 131, Windows 11, RTX 3060 / Intel Iris Xe
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console Errors or Screenshots
      render: shell
    validations:
      required: false
